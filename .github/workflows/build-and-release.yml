name: Build resume and publish it on GitHub releases

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: build & release – ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read dotenv vars
        uses: xom9ikk/dotenv@v2

      - name: Create temporary folders
        run: mkdir -p Results Temp

      - name: Build documents (default + IoT profile)
        run: |
          ./Scripts/build.sh
          ./Scripts/build.sh --profile=iot
          ls -lisah Results

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-${{ github.ref_name }}
          path: Results/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            Results/resume-${{ env.RESUME_FILENAME }}-${{ github.ref_name }}.pdf
            Results/resume-${{ env.RESUME_FILENAME }}-${{ github.ref_name }}.epub
            Results/resume-${{ env.RESUME_FILENAME }}-iot-${{ github.ref_name }}.pdf
            Results/resume-${{ env.RESUME_FILENAME }}-iot-${{ github.ref_name }}.epub
            Results/${{ env.RESUME_FILENAME }}-introduction-${{ github.ref_name }}.pdf
            Results/${{ env.RESUME_FILENAME }}-curriculum-vitae-${{ github.ref_name }}.pdf
            Results/${{ env.RESUME_FILENAME }}-portfolio-${{ github.ref_name }}.pdf
          append_body: true
          body: |
            #### Download

            | PDF | EPUB |
            | --- | ---- |
            | <a href="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/resume-${{ env.RESUME_FILENAME }}-${{ github.ref_name }}.pdf"><img width="144" src="https://cdn.githubraw.com/${{ github.repository }}/main/Content/Media/Cover/Cover-pdf.png" alt="Cover for pdf" /></a> | <a href="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/resume-${{ env.RESUME_FILENAME }}-${{ github.ref_name }}.epub"><img width="144" src="https://cdn.githubraw.com/${{ github.repository }}/main/Content/Media/Cover/Cover-epub.png" alt="Cover for epub" /></a> |
            | [![Badge PDF](https://img.shields.io/badge/PDF-resume-100000?style=for-the-badge&labelColor=4E4796&color=DBD7FF)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/resume-${{ env.RESUME_FILENAME }}-${{ github.ref_name }}.pdf) | [![Badge Epub](https://img.shields.io/badge/EPUB-resume-100000?style=for-the-badge&labelColor=4E4796&color=DBD7FF)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/resume-${{ env.RESUME_FILENAME }}-${{ github.ref_name }}.epub) |

            ##### Download single files

            | Document     | Download |
            | ------------ | -------- |
            | Introduction | [![Badge Introduction](https://img.shields.io/badge/DE-Introduction-100000?style=for-the-badge&labelColor=4E4796&color=DBD7FF)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.RESUME_FILENAME }}-introduction-${{ github.ref_name }}.pdf) |
            | CV           | [![Badge CV](https://img.shields.io/badge/DE-CV-100000?style=for-the-badge&labelColor=4E4796&color=DBD7FF)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.RESUME_FILENAME }}-curriculum-vitae-${{ github.ref_name }}.pdf) |
            | Portfolio    | [![Badge Portfolio](https://img.shields.io/badge/DE-Portfolio-100000?style=for-the-badge&labelColor=4E4796&color=DBD7FF)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.RESUME_FILENAME }}-portfolio-${{ github.ref_name }}.pdf) |

            ##### IoT Focus

            | Format | Download |
            | ------ | -------- |
            | PDF    | [![Badge IoT PDF](https://img.shields.io/badge/PDF-IoT-100000?style=for-the-badge&labelColor=2E7D32&color=A5D6A7)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/resume-${{ env.RESUME_FILENAME }}-iot-${{ github.ref_name }}.pdf) |
            | EPUB   | [![Badge IoT EPUB](https://img.shields.io/badge/EPUB-IoT-100000?style=for-the-badge&labelColor=2E7D32&color=A5D6A7)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/resume-${{ env.RESUME_FILENAME }}-iot-${{ github.ref_name }}.epub) |
